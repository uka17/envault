info:
  name: Delete stash by ID
  type: http
  seq: 4
  tags:
    - Stash

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/stashes/:id"
  params:
    - name: id
      value: "42"
      type: path
      description: Positive integer Stash ID (1 through 2147483647)
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Stash deleted, returns the TypeORM DeleteResult
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: DELETE
      params:
        - name: id
          value: "42"
          type: path
          description: Positive integer Stash ID (1 through 2147483647)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "affected": 1
          }
  - name: 200 Response
    description: Stash deleted, returns the TypeORM DeleteResult
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: DELETE
      params:
        - name: id
          value: "42"
          type: path
          description: Positive integer Stash ID (1 through 2147483647)
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/xml
      body:
        type: xml
        data: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <root>
            <affected>1</affected>
          </root>
  - name: 401 Response
    description: Missing or invalid JWT token
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: DELETE
      params:
        - name: id
          value: "42"
          type: path
          description: Positive integer Stash ID (1 through 2147483647)
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Unauthorized"
          }
  - name: 401 Response
    description: Missing or invalid JWT token
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: DELETE
      params:
        - name: id
          value: "42"
          type: path
          description: Positive integer Stash ID (1 through 2147483647)
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/xml
      body:
        type: xml
        data: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <root>
            <error>Unauthorized</error>
          </root>
  - name: 422 Response
    description: "Validation error: invalid ID format"
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: DELETE
      params:
        - name: id
          value: "42"
          type: path
          description: Positive integer Stash ID (1 through 2147483647)
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "errors": [
              {
                "field": "email",
                "message": "must be a valid email"
              }
            ]
          }
  - name: 422 Response
    description: "Validation error: invalid ID format"
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: DELETE
      params:
        - name: id
          value: "42"
          type: path
          description: Positive integer Stash ID (1 through 2147483647)
    response:
      status: 422
      statusText: Unprocessable Entity
      headers:
        - name: Content-Type
          value: application/xml
      body:
        type: xml
        data: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <root>
            <errors>[object Object]</errors>
          </root>
  - name: 404 Missing or foreign stash
    description: Missing and other users' stashes return the same neutral response
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: DELETE
      params:
        - name: id
          value: "42"
          type: path
          description: Missing stash ID or an ID owned by another account
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "stash_not_found",
            "message": "Stash not found",
            "errors": []
          }

docs: |-
  Only the authenticated owner can perform this operation. The owner comes from
  the access token, never from the request body. Missing and foreign stash IDs
  both return HTTP 404 with code stash_not_found.

  Manual ownership check: create a stash with account A. Set accessToken to the
  token of a second verified account B and use A's stash ID in this request.
  Expect 404; repeat with a missing ID and compare the same response. Switch back
  to A and verify that the recipient, ciphertext and schedule remain unchanged.
  Without an access token expect 401. With A's token the operation succeeds.

  Unsent stashes can be cancelled only before a worker locks their row for delivery. Active delivery or concurrent mutations return 409 stash_delivery_in_progress. Sent stashes can be deleted: content and SendLog entries are removed and the public link is revoked, but the delivered email cannot be recalled.
