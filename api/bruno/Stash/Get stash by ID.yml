info:
  name: Get stash by ID
  type: http
  seq: 3
  tags:
    - Stash

http:
  method: GET
  url: "{{baseUrl}}/api/v1/stashes/:id"
  params:
    - name: id
      value: "42"
      type: path
      description: Stash ID
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Stash found
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: GET
      params:
        - name: id
          value: "42"
          type: path
          description: Stash ID
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 42,
            "to": "journalist@fakemail.com",
            "body": "<encrypted>",
            "isSent": false,
            "scheduledAt": "2025-12-31T23:59:59Z",
            "createdOn": "2025-01-01T00:00:00Z",
            "modifiedOn": "2025-01-01T00:00:00Z"
          }
  - name: 200 Response
    description: Stash found
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: GET
      params:
        - name: id
          value: "42"
          type: path
          description: Stash ID
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/xml
      body:
        type: xml
        data: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <root>
            <id>42</id>
            <to>journalist@fakemail.com</to>
            <body><encrypted></body>
            <isSent>false</isSent>
            <scheduledAt>2025-12-31T23:59:59Z</scheduledAt>
            <createdOn>2025-01-01T00:00:00Z</createdOn>
            <modifiedOn>2025-01-01T00:00:00Z</modifiedOn>
          </root>
  - name: 401 Response
    description: Missing or invalid JWT token
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: GET
      params:
        - name: id
          value: "42"
          type: path
          description: Stash ID
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": "Unauthorized"
          }
  - name: 401 Response
    description: Missing or invalid JWT token
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: GET
      params:
        - name: id
          value: "42"
          type: path
          description: Stash ID
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/xml
      body:
        type: xml
        data: |-
          <?xml version="1.0" encoding="UTF-8"?>
          <root>
            <error>Unauthorized</error>
          </root>
  - name: 404 Missing or foreign stash
    description: Missing and other users' stashes return the same neutral response
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id"
      method: GET
      params:
        - name: id
          value: "42"
          type: path
          description: Missing stash ID or an ID owned by another account
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "stash_not_found",
            "message": "Stash not found",
            "errors": []
          }

docs: |-
  Only the authenticated owner can perform this operation. The owner comes from
  the access token, never from the request body. Missing and foreign stash IDs
  both return HTTP 404 with code stash_not_found.

  Manual ownership check: create a stash with account A. Set accessToken to the
  token of a second verified account B and use A's stash ID in this request.
  Expect 404; repeat with a missing ID and compare the same response. Switch back
  to A and verify that the recipient, ciphertext and schedule remain unchanged.
  Without an access token expect 401. With A's token the operation succeeds.
