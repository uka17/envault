  - name: 500 Response
    description: Snooze update failed
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id/snooze/:hours"
      method: POST
      params:
        - name: id
          value: "42"
          type: path
          description: Positive integer Stash ID (1 through 2147483647)
        - name: hours
          value: "24"
          type: path
          description: Integer hours from 1 through 8760, each exactly 3600000 milliseconds
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/xml
      body:
        type: xml
        data: |-
