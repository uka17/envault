info:
  name: Snooze stash for N hours
  type: http
  seq: 5
  tags:
    - Stash

http:
  method: POST
  url: "{{baseUrl}}/api/v1/stashes/:id/snooze/:hours"
  params:
    - name: id
      value: "42"
      type: path
      description: Positive integer Stash ID (1 through 2147483647)
    - name: hours
      value: "24"
      type: path
      description: Integer hours from 1 through 8760, each exactly 3600000 milliseconds
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Stash snoozed, returns updated stash
    request:
      url: "{{baseUrl}}/api/v1/stashes/:id/snooze/:hours"
      method: POST
      params:
        - name: id
          value: "42"
          type: path
          description: Positive integer Stash ID (1 through 2147483647)
        - name: hours
          value: "24"
          type: path
          description: Integer hours from 1 through 8760, each exactly 3600000 milliseconds
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": 42,
            "to": "journalist@fakemail.com",
            "body": "<encrypted>",
            "isSent": false,
            "scheduledAt": "2030-12-31T23:59:59Z",
            "createdOn": "2025-01-01T00:00:00Z",
            "modifiedOn": "2025-01-01T00:00:00Z"
          }
  - name: 200 Response
