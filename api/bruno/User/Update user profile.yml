info:
  name: Update user profile
  type: http
  seq: 5
  tags:
    - User

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/users/me"
  auth:
    type: bearer
    token: "{{accessToken}}"
  body:
    type: json
    data: |-
      {
        "name": "John Doe",
        "email": "new@mail.com"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Pending email change
    description: Old login remains valid. Repeating the pending address sends nothing; use resend. Current email cancels the request.
    request:
      url: "{{baseUrl}}/api/v1/users/me"
      method: PATCH
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "id": 1,
            "email": "john@mail.com",
            "pendingEmail": "new@mail.com",
            "name": "John Doe",
            "emailVerifiedAt": "2025-01-01T00:00:00Z"
          }
