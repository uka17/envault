info:
  name: Confirm password reset
  type: http
  seq: 21
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/password-reset/confirm"
  body:
    type: json
    data: |-
      { "token": "{{passwordResetToken}}", "newPassword": "{{newPassword}}" }
  auth:
    type: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    request:
      url: "{{baseUrl}}/api/v1/users/password-reset/confirm"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: '{}'
  - name: 400 Response
    request:
      url: "{{baseUrl}}/api/v1/users/password-reset/confirm"
      method: POST
    response:
      status: 400
      statusText: Bad Request
      body:
        type: json
        data: '{"code":"password_reset_invalid"}'
  - name: 422 Response
    request:
      url: "{{baseUrl}}/api/v1/users/password-reset/confirm"
      method: POST
    response:
      status: 422
      statusText: Unprocessable Entity
      body:
        type: json
        data: '{"code":"validation_error"}'
  - name: 429 Response
    request:
      url: "{{baseUrl}}/api/v1/users/password-reset/confirm"
      method: POST
    response:
      status: 429
      statusText: Too Many Requests
      body:
        type: json
        data: '{"code":"password_reset_rate_limited"}'
  - name: 500 Response
    request:
      url: "{{baseUrl}}/api/v1/users/password-reset/confirm"
      method: POST
    response:
      status: 500
      statusText: Internal Server Error
      body:
        type: json
        data: '{"code":"error_500"}'

docs: |-
  Public endpoint. Never log or commit real reset tokens or passwords.
  Request sends only to verified accounts and always returns 200 {} for valid, non-throttled addresses.
  Token expires in 30 minutes; a new accepted request replaces the previous token.
  Confirmation revokes all sessions and requires a new login. It does not recover stash encryption keys.
  429 includes Retry-After in seconds. See docs/password-reset.md for limits and integration checks.
