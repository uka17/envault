info:
  name: Logout user
  type: http
  seq: 7
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/api/v1/users/logout"
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Logout successful
    request:
      url: "{{baseUrl}}/api/v1/users/logout"
      method: POST
    response:
      status: 200
      statusText: OK
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Missing or invalid JWT token, or its session is revoked or expired
    request:
      url: "{{baseUrl}}/api/v1/users/logout"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "incorrect_token"
          }

docs: Revokes the session, so its access and refresh tokens stop working immediately, and clears the cookie. Requires a valid access token.
