services:
  postgres:
    image: postgres:18-alpine
    container_name: envault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      envault_network:
        ipv4_address: ${DB_HOST}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h $DB_HOST -p $DB_PORT"]
      interval: 5s
      timeout: 3s
      retries: 3        
  
  api:
    # Images are immutable and tagged by commit. Deploy with scripts/deploy.sh, which sets IMAGE_TAG.
    image: uka17/envault-api:${IMAGE_TAG:?IMAGE_TAG is required, deploy with scripts/deploy.sh <commit sha>}
    # Single replica: in-memory rate limits are per process (docs/rate-limits.md).
    # container_name also prevents scaling this service by accident.
    container_name: envault-api
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      API_JWT_SECRET: ${API_JWT_SECRET}
      ENV: ${ENV}
      SHOW_LOGS: ${SHOW_LOGS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOKI_HOST: ${LOKI_HOST}
      LOKI_USER: ${LOKI_USER}
      LOKI_API_KEY: ${LOKI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      BASE_URL: ${BASE_URL}
      TRUST_PROXY: ${TRUST_PROXY}
    depends_on:
      postgres:
        condition: service_healthy
    # Readiness includes a database query, see GET /ready
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      envault_network:
        ipv4_address: ${API_HOST}

  worker:
    image: uka17/envault-worker:${IMAGE_TAG:?IMAGE_TAG is required, deploy with scripts/deploy.sh <commit sha>}
    container_name: envault-worker
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      ENV: ${ENV}
      SHOW_LOGS: ${SHOW_LOGS}
      LOG_LEVEL: ${LOG_LEVEL}
      LOKI_HOST: ${LOKI_HOST}
      LOKI_USER: ${LOKI_USER}
      LOKI_API_KEY: ${LOKI_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      BASE_URL: ${BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    # Fails when the delivery loop stops making progress, see worker/src/heartbeat.ts
    healthcheck:
      test: ["CMD", "node", "dist/worker/src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      envault_network:
        ipv4_address: ${WORKER_HOST}

volumes:
  postgres_data:

networks:
  envault_network:
    name: envault_network
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET}
