name: Release

on:
  push:
    branches:
      - master

# GITHUB_TOKEN is read-only for every job, jobs opt out or in explicitly
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A deploy to master is never cancelled halfway through a rollout or a rollback
  cancel-in-progress: false

jobs:
  lint:
    name: 🔎 Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

  tests:
    name: 🧪 Tests
    uses: ./.github/workflows/tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: 🚢 Publish image (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests
    strategy:
      matrix:
        component: [api, worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfiles/${{ matrix.component }}
          push: true
          build-args: GIT_COMMIT_SHA=${{ github.sha }}
          tags: uka17/envault-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    # No checkout here, the job talks to EC2 over SSH only
    permissions: {}
    #environment:
    #  name: PROD
    #  url: http://ec2-13-60-105-210.eu-north-1.compute.amazonaws.com:9000 

    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Covers a rollout and a rollback, each waiting for the health checks
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/envault

            # docker-compose.yml and the deploy script are taken from the deployed commit
            git fetch --quiet origin master
            git checkout --quiet --detach ${{ github.sha }}

            # Health-gated rollout with a rollback to the previous version, see scripts/deploy.sh
            ./scripts/deploy.sh ${{ github.sha }}
